name: Dependency release

# Publishes a patch release when a bundled (runtime) Composer package changed
# since the last tag. CI starts it after merging a Dependabot update; it can
# also be started by hand. Without a bundled package change it does nothing.
#
# It refuses to release when other plugin files changed since the last tag:
# those changes need a hand-written changelog, see docs/releasing.md.

on:
  workflow_dispatch:

concurrency: release

permissions:
  contents: write
  actions: write # Starts the WordPress.org deploy for the new tag.

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2
      - id: plan
        run: |
          last_tag="$(git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*')"
          runtime_packages() { jq -r '.packages[] | "\(.name) \(.version | ltrimstr("v"))"' | sort; }
          changes="$(comm -13 <(git show "${last_tag}:composer.lock" | runtime_packages) <(runtime_packages < composer.lock))"
          if [[ -z "$changes" ]]; then
            echo "No bundled package changed since $last_tag; nothing to release." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Everything that ships (see bin/build-release.sh), except the Composer files.
          other="$(git diff --name-only "$last_tag" HEAD -- . ':!.github' ':!.gitignore' ':!.wordpress-org' \
            ':!AGENTS.md' ':!bin' ':!docs' ':!phpcs.xml.dist' ':!phpstan.neon' \
            ':!phpunit.xml.dist' ':!tests' ':!composer.json' ':!composer.lock')"
          if [[ -n "$other" ]]; then
            printf 'Plugin files changed since %s; release by hand (docs/releasing.md):\n%s\n' "$last_tag" "$other" >&2
            exit 1
          fi
          IFS=. read -r major minor patch <<< "${last_tag#v}"
          {
            echo "release=true"
            echo "version=$major.$minor.$((patch + 1))"
            echo "entries<<EOF"
            while read -r name version; do echo "* Updated the bundled $name library to $version."; done <<< "$changes"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - if: steps.plan.outputs.release == 'true'
        uses: ramsey/composer-install@v4
      - if: steps.plan.outputs.release == 'true'
        env:
          VERSION: ${{ steps.plan.outputs.version }}
          ENTRIES: ${{ steps.plan.outputs.entries }}
        run: |
          sed -i "s/^ \* Version: .*/ * Version: $VERSION/" diesis-jwt-auth.php
          sed -i "s/^Stable tag: .*/Stable tag: $VERSION/" readme.txt
          sed -i "s/^\"Project-Id-Version: \(.*\) [0-9.]*\\\\n\"$/\"Project-Id-Version: \1 $VERSION\\\\n\"/" languages/*.po
          ENTRY="$(printf '= %s =\n%s\n' "$VERSION" "$ENTRIES")" \
            perl -0pi -e 's/(== Changelog ==\n\n)/$1$ENV{ENTRY}\n\n/' readme.txt
          composer i18n:pot
          composer i18n:php
          composer test
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -qam "chore: release $VERSION"
          git tag -a "v$VERSION" -m "v$VERSION"
      - if: steps.plan.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.plan.outputs.version }}
          ENTRIES: ${{ steps.plan.outputs.entries }}
        run: |
          # Build before pushing, so a failed build leaves no tag behind.
          chmod +x bin/build-release.sh bin/strauss.sh
          bin/build-release.sh "$VERSION"
          zip="dist/diesis-jwt-auth-$VERSION.zip"
          git push --atomic origin HEAD:main "v$VERSION"
          notes="$(printf '%s\n\nNo code or settings changes.\n\nSHA-256 of `%s`: `%s`' \
            "${ENTRIES//\* /}" "$(basename "$zip")" "$(sha256sum "$zip" | cut -d' ' -f1)")"
          gh release create "v$VERSION" "$zip" \
            --title "DIESIS JWT Auth for Cloudflare Access $VERSION" \
            --notes "$notes"
          # Tags pushed with the workflow token start no workflows, so start the deploy here.
          gh workflow run deploy-wporg.yml --ref "v$VERSION"
