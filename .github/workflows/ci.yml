name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.1', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2
      - uses: ramsey/composer-install@v3
      - run: composer test
      - run: composer analyse
      - run: composer lint

  package:
    runs-on: ubuntu-latest
    needs: quality
    permissions:
      contents: read
      pull-requests: write # Plugin Check posts its findings on the PR.
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2
      - id: version
        run: |
          echo "value=$(sed -n 's/^ \* Version: //p' diesis-wp-jwt-auth.php)" >> "$GITHUB_OUTPUT"
      - run: chmod +x bin/build-release.sh
      - run: bin/build-release.sh "${{ steps.version.outputs.value }}"
      - uses: actions/upload-artifact@v4
        with:
          name: diesis-wp-jwt-auth-${{ steps.version.outputs.value }}
          path: dist/diesis-wp-jwt-auth-${{ steps.version.outputs.value }}.zip
      # Plugin Check runs against the unpacked ZIP, so it sees exactly what
      # WordPress.org gets. The slug warning about "wp" is allowed by the
      # directory and expected.
      - run: unzip -q dist/diesis-wp-jwt-auth-${{ steps.version.outputs.value }}.zip -d dist/unpacked
      - uses: wordpress/plugin-check-action@v1
        with:
          build-dir: dist/unpacked/diesis-wp-jwt-auth
          strict: true
          ignore-codes: trademarked_term
