name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.1', '8.4']
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2
      - uses: ramsey/composer-install@v4
      - run: composer test
      - run: composer analyse
      - run: composer lint
      # Exercise the minimum supported WordPress translation loader without a DB.
      # Network activation does not register Domain Path; the plugin must do it.
      - name: Check bundled translations with WordPress 6.8
        run: |
          fixture="$(mktemp -d)"
          trap 'rm -rf "$fixture"' EXIT
          curl -fsSL https://wordpress.org/wordpress-6.8.tar.gz | tar -xz -C "$fixture"
          mkdir -p "$fixture/plugins/diesis-jwt-auth"
          cp diesis-jwt-auth.php "$fixture/plugins/diesis-jwt-auth/"
          cp -R languages "$fixture/plugins/diesis-jwt-auth/"
          for locale in de_DE es_ES it_IT ja pt_BR zh_CN; do
            php tests/wordpress-translations.php "$locale" "$fixture/wordpress" "$fixture/plugins"
          done

  package:
    runs-on: ubuntu-latest
    needs: quality
    permissions:
      contents: read
      pull-requests: write # Plugin Check posts its findings on the PR.
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2
      - id: version
        run: |
          echo "value=$(sed -n 's/^ \* Version: //p' diesis-jwt-auth.php)" >> "$GITHUB_OUTPUT"
      - run: chmod +x bin/build-release.sh
      - run: bin/build-release.sh "${{ steps.version.outputs.value }}"
      - uses: actions/upload-artifact@v7
        with:
          name: diesis-jwt-auth-${{ steps.version.outputs.value }}
          path: dist/diesis-jwt-auth-${{ steps.version.outputs.value }}.zip
      # Plugin Check runs against the unpacked ZIP, so it sees exactly what
      # WordPress.org gets.
      - run: unzip -q dist/diesis-jwt-auth-${{ steps.version.outputs.value }}.zip -d dist/unpacked
      - uses: wordpress/plugin-check-action@v1
        with:
          build-dir: dist/unpacked/diesis-jwt-auth
          strict: true

  # Merges a green Dependabot minor or patch update unless it touches the
  # deploy action. Everything else waits for a manual review. The release
  # workflow then decides whether the merge warrants a new plugin release.
  dependabot:
    runs-on: ubuntu-latest
    needs: package
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    permissions:
      contents: write
      pull-requests: write
      actions: write # Starts the release workflow.
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@v3
      - if: >-
          (steps.meta.outputs.update-type == 'version-update:semver-minor' ||
           steps.meta.outputs.update-type == 'version-update:semver-patch') &&
          !contains(steps.meta.outputs.dependency-names, '10up/action-wordpress-plugin-deploy')
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          gh pr merge "$PR" --repo "$GITHUB_REPOSITORY" --merge --match-head-commit "$SHA"
          # A merge made with the workflow token starts no workflows, so start the release here.
          gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref main
