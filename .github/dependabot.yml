# Daily version updates at 05:00 Vienna time. Security updates are enabled in
# the repository settings. Each ecosystem bundles its minor and patch updates
# in the group routine-updates; a major comes as its own PR. CI merges green
# non-major updates, so new versions wait a week before Dependabot proposes
# them; the cooldown never delays security updates. After a merge, release.yml
# publishes bundled (runtime) package updates automatically (docs/releasing.md).
version: 2
updates:
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: daily
      time: "05:00"
      timezone: Europe/Vienna
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore(deps)
    ignore:
      # PHPUnit 13 needs PHP 8.4, but the plugin still supports PHP 8.3.
      # Drop this rule when Requires PHP reaches 8.4.
      - dependency-name: phpunit/phpunit
        versions: ['>=13']
    groups:
      routine-updates:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
      time: "05:00"
      timezone: Europe/Vienna
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
    groups:
      routine-updates:
        patterns: ["*"]
        update-types: [minor, patch]
        # The deploy action only runs on release tags, so PR CI never tests it.
        # A separate PR keeps its updates visible for a manual review.
        exclude-patterns:
          - 10up/action-wordpress-plugin-deploy
